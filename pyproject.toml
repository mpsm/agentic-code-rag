[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[project]
name = "agentic-code-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "logging>=0.4.9.6",
    "ollama>=0.6.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "pydantic-settings>=2.12.0",
    "qdrant-client>=1.16.2",
    "rich>=14.2.0",
    "strands-agents>=1.20.0",
]

[project.scripts]
agentic-code-rag = "agentic_code_rag.main:cli"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "poethepoet>=0.39.0",
    "ruff>=0.14.10",
    "strands-agents-mcp-server>=0.2.5",
]

[tool.poe.tasks]
lint = { cmd = "ruff check ." }
format-check = { cmd = "ruff format --check ." }
format = { cmd = "ruff format ." }
mypy = { cmd = "mypy ." }
build = { cmd = "uv build" }
release = ["lint", "format-check", "mypy", "build"]
